[project]
name = "speechsep"
version = "0.1.0"
description = "Modular pipeline for source separation, speaker diarization, and transcription."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    # Core audio
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    # Stage 1 — Source separation + denoising (SepFormer + ECAPA-TDNN)
    "speechbrain>=1.0.0",
    # Stage 2 — VAD
    "silero-vad>=5.1.0",
    # Stage 3 — Speaker clustering
    "scikit-learn>=1.3.0",
    # Stage 4 — ASR
    "faster-whisper>=1.0.0",
    # Utilities
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",           # FastAPI TestClient
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
speechsep = "speechsep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speechsep"]
